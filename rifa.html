<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Rifa KPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --kps-black:#0b0b0d;
    --kps-charcoal:#1c1c20;
    --kps-red:#e2231a;
    --kps-blue:#1e8fc7;
    --kps-white:#f4f4f1;
    --kps-amber:#f0a825;
    --kps-line:#2e2e33;
    --radius:10px;
    --shadow:0 8px 24px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--kps-white);
    color:var(--kps-black);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Anton',sans-serif; letter-spacing:.02em; text-transform:uppercase; margin:0;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Rajdhani',sans-serif; cursor:pointer;}

  /* ---------- HEADER / CAROUSEL ---------- */
  .site-header{position:relative; overflow:hidden; background:var(--kps-black); color:var(--kps-white);}
  .carousel{position:relative; min-height:300px;}
  .slide{
    position:absolute; inset:0; display:flex; align-items:center;
    opacity:0; transform:translateX(24px); transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1; transform:translateX(0); pointer-events:auto; position:relative;}
  .slide-bg{position:absolute; inset:0; z-index:0;}
  .slide-inner{position:relative; z-index:2; width:100%; max-width:1100px; margin:0 auto; padding:38px 28px 46px; display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap;}
  .brand-badge{
    background:var(--kps-white); border-radius:8px; padding:10px 14px 6px;
    box-shadow:var(--shadow); flex-shrink:0;
  }
  .brand-badge img{display:block; height:52px; width:auto;}
  .slide-copy{flex:1; min-width:240px;}
  .slide-photo{width:150px; flex-shrink:0; background:#fff; border-radius:8px; padding:5px; box-shadow:var(--shadow); align-self:flex-start;}
  .slide-photo img{width:100%; height:120px; object-fit:cover; border-radius:5px; display:block;}
  .slide-eyebrow{
    display:inline-block; font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; font-size:12.5px; padding:4px 10px; border-radius:3px; margin-bottom:10px;
  }
  .slide h1, .slide h2{font-size:clamp(28px,5vw,44px); line-height:1.02; margin-bottom:8px;}
  .slide .sub{font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:600; opacity:.92; max-width:560px; margin-bottom:14px;}
  .prize-list{list-style:none; margin:0 0 12px; padding:0; display:flex; flex-direction:column; gap:5px;}
  .prize-list li{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:16px; display:flex; gap:8px; align-items:baseline;}
  .prize-list .tag{
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:1px 7px; border-radius:3px;
    background:var(--kps-white); color:var(--kps-black); flex-shrink:0;
  }
  .slide-note{
    font-size:13px; font-family:'Rajdhani',sans-serif; font-weight:600; opacity:.85;
    border-left:3px solid var(--kps-white); padding-left:10px; max-width:560px;
  }
  .carousel-band{height:20px; position:relative; overflow:hidden;}
  .carousel-controls{
    position:absolute; bottom:14px; right:24px; z-index:5; display:flex; gap:10px; align-items:center;
  }
  .arrow-btn{
    background:rgba(244,244,241,.12); border:1px solid rgba(244,244,241,.35); color:var(--kps-white);
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px; transition:background .2s;
  }
  .arrow-btn:hover{background:rgba(244,244,241,.28);}
  .dots{display:flex; gap:7px;}
  .dot{width:9px; height:9px; border-radius:50%; background:rgba(244,244,241,.35); border:none; padding:0;}
  .dot.active{background:var(--kps-white);}

  /* ---------- LAYOUT ---------- */
  .wrap{max-width:1100px; margin:0 auto; padding:0 20px;}
  .section{padding:44px 0;}
  .section-title{font-size:26px; margin-bottom:6px;}
  .section-sub{font-family:'Rajdhani',sans-serif; font-weight:600; color:#555; margin-bottom:24px; font-size:15px;}

  .steps-bar{display:flex; gap:0; margin-bottom:28px; border-bottom:2px solid var(--kps-line);}
  .step-pill{
    flex:1; text-align:center; padding:10px 6px; font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#9a9a9a; border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .step-pill.done{color:var(--kps-black);}
  .step-pill.current{color:var(--kps-red); border-color:var(--kps-red);}

  /* ---------- TOOLBAR / GRID ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
  .input, select{
    font-family:'Space Mono',monospace; border:2px solid var(--kps-black); border-radius:6px;
    padding:9px 11px; font-size:14px; background:var(--kps-white);
  }
  select{font-family:'Rajdhani',sans-serif; font-weight:600;}
  .btn{
    border:2px solid var(--kps-black); background:var(--kps-black); color:var(--kps-white);
    border-radius:6px; padding:10px 18px; font-weight:700; font-size:15px; letter-spacing:.02em;
    transition:transform .12s ease, background .2s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.secondary{background:var(--kps-white); color:var(--kps-black);}
  .btn.red{background:var(--kps-red); border-color:var(--kps-red);}
  .btn.blue{background:var(--kps-blue); border-color:var(--kps-blue);}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn.small{padding:6px 12px; font-size:13px;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13.5px; margin-bottom:14px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:14px; height:14px; border-radius:3px; display:inline-block; border:1px solid var(--kps-line);}

  .num-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:7px; margin-bottom:18px;
  }
  .num-tile{
    font-family:'Space Mono',monospace; font-weight:700; font-size:14.5px; text-align:center;
    padding:9px 2px; border-radius:5px; border:2px solid var(--kps-line); background:var(--kps-white);
    transition:transform .1s ease;
  }
  .num-tile.available:hover{border-color:var(--kps-black); transform:translateY(-2px);}
  .num-tile.selected{background:var(--kps-blue); border-color:var(--kps-blue); color:var(--kps-white); transform:translateY(-2px);}
  .num-tile.pending{background:var(--kps-amber); border-color:var(--kps-amber); color:var(--kps-black); cursor:not-allowed;}
  .num-tile.sold{background:var(--kps-charcoal); border-color:var(--kps-charcoal); color:#767680; cursor:not-allowed; text-decoration:line-through;}

  .pagination{display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:8px; font-family:'Rajdhani',sans-serif; font-weight:700;}

  .cart-bar{
    position:sticky; bottom:0; background:var(--kps-black); color:var(--kps-white); padding:14px 20px;
    border-radius:10px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    box-shadow:var(--shadow);
  }
  .cart-nums{font-family:'Space Mono',monospace; font-size:14px; opacity:.9; max-width:60%;}
  .cart-total{font-family:'Anton',sans-serif; font-size:22px;}

  /* ---------- FORMS ---------- */
  .card{background:#fff; border:2px solid var(--kps-line); border-radius:var(--radius); padding:26px; max-width:640px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;}
  .field input, .field select{width:100%; font-family:'Inter',sans-serif; border:1.5px solid #ccc; border-radius:6px; padding:10px 12px; font-size:15px;}
  .field input:focus, .field select:focus{outline:2px solid var(--kps-blue); border-color:var(--kps-blue);}
  .field .err{color:var(--kps-red); font-size:12.5px; margin-top:4px; display:none; font-weight:600;}
  .field.invalid input, .field.invalid select{border-color:var(--kps-red);}
  .field.invalid .err{display:block;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}}

  .pay-box{background:var(--kps-charcoal); color:var(--kps-white); border-radius:var(--radius); padding:22px; margin-bottom:20px;}
  .pay-box h3{color:var(--kps-white); font-size:18px; margin-bottom:10px;}
  .pay-row{display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:14px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.15);}
  .pay-row span:first-child{opacity:.65;}
  .checkbox-row{display:flex; gap:10px; align-items:flex-start; margin:16px 0;}
  .checkbox-row input{margin-top:3px;}
  .checkbox-row label{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px;}

  .confirm-box{text-align:center; padding:40px 20px; max-width:560px; margin:0 auto;}
  .confirm-icon{width:64px; height:64px; border-radius:50%; background:var(--kps-blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 18px;}
  .order-id{font-family:'Space Mono',monospace; background:var(--kps-charcoal); color:var(--kps-white); padding:10px 16px; border-radius:6px; display:inline-block; margin:14px 0;}

  .status-badge{font-family:'Space Mono',monospace; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase;}
  .status-badge.pendiente{background:var(--kps-amber); color:#000;}
  .status-badge.aprobado{background:#3fae5b; color:#fff;}
  .status-badge.rechazado{background:var(--kps-red); color:#fff;}

  /* ---------- ADMIN ---------- */
  .admin-link{
    display:block; text-align:center; padding:16px; font-family:'Rajdhani',sans-serif; font-weight:700;
    color:#999; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
  }
  .admin-panel{background:var(--kps-black); color:var(--kps-white); min-height:100vh; padding:26px 0 60px;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:26px;}
  .stat-card{background:var(--kps-charcoal); border-radius:8px; padding:16px;}
  .stat-card .num{font-family:'Anton',sans-serif; font-size:28px;}
  .stat-card .lbl{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; text-transform:uppercase; opacity:.7;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--kps-line); vertical-align:top;}
  th{font-family:'Rajdhani',sans-serif; text-transform:uppercase; font-size:11.5px; letter-spacing:.05em; opacity:.7;}
  td.nums{font-family:'Space Mono',monospace; font-size:12.5px;}
  .table-wrap{overflow-x:auto; background:var(--kps-charcoal); border-radius:8px; padding:6px 14px;}
  .admin-login{max-width:360px; margin:80px auto; text-align:center;}
  .admin-login input{width:100%; padding:12px; border-radius:6px; border:1.5px solid #444; background:#111; color:#fff; font-family:'Space Mono',monospace; margin-bottom:12px; text-align:center;}
  .admin-tabs{display:flex; gap:8px; margin-bottom:22px;}
  .admin-tab{background:var(--kps-charcoal); color:#bbb; border:1.5px solid var(--kps-line); border-radius:6px; padding:8px 16px; font-weight:700; font-size:13.5px;}
  .admin-tab.active{background:var(--kps-red); color:#fff; border-color:var(--kps-red);}
  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;}

  footer{background:var(--kps-black); color:#8b8b90; text-align:center; padding:20px; font-family:'Rajdhani',sans-serif; font-size:12.5px;}
  .hidden{display:none !important;}
  .refresh-note{font-family:'Rajdhani',sans-serif; font-size:12.5px; color:#777; margin-bottom:14px;}
  .loading{padding:60px 20px; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; color:#999;}
  .banner{padding:12px 18px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14.5px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .banner.error{background:#fde8e7; color:#8a1410; border:1.5px solid var(--kps-red);}
  .banner.info{background:#e8f4fb; color:#0d4f6e; border:1.5px solid var(--kps-blue);}
  .banner button{background:none; border:none; font-size:18px; font-weight:900; color:inherit; line-height:1; padding:0 4px;}
  .field-error-inline{color:var(--kps-red); font-size:12.5px; font-weight:700; font-family:'Rajdhani',sans-serif; margin-top:6px;}
</style>
</head>

function allNumbers(){
  const arr = [];
  for(let i=CONFIG.numberMin;i<=CONFIG.numberMax;i++) arr.push(String(i).padStart(4,"0"));
  return arr;
}
const NUMBERS = allNumbers();

function statusOf(n){
  const rec = state.data.numbers[n];
  if(!rec) return "disponible";
  return rec.status; // pendiente | vendido
}

/* =========================================================
   BACKEND (Firebase Firestore) — ver CONFIG.firebase
========================================================= */
let _db = null;

function apiConfigured(){
  return CONFIG.firebase && CONFIG.firebase.apiKey && !String(CONFIG.firebase.apiKey).startsWith("[EDITAR");
}

function getDb(){
  if(_db) return _db;
  if(!apiConfigured()) return null;
  if(typeof firebase === "undefined") return null;
  if(!firebase.apps.length){
    firebase.initializeApp(CONFIG.firebase);
  }
  _db = firebase.firestore();
  return _db;
}

async function loadData(){
  const db = getDb();
  if(!db) return { numbers:{}, orders:{}, _apiError:"not_configured" };
  try{
    const snap = await db.collection("orders").get();
    const orders = {}, numbers = {};
    snap.forEach(doc=>{
      const o = doc.data();
      o.id = doc.id;
      orders[o.id] = o;
      if(o.status !== "rechazado"){
        (o.numbers||[]).forEach(n=>{ numbers[n] = { status: o.status==="aprobado" ? "vendido" : "pendiente", orderId:o.id }; });
      }
    });
    return { numbers, orders };
  }catch(e){
    console.warn("loadData: no se pudo conectar con Firebase", e);
    return { numbers:{}, orders:{}, _apiError: "No se pudo conectar con la base de datos: " + e.message };
  }
}

async function createOrderRemote(order){
  const db = getDb();
  if(!db) return { ok:false, message:"El sitio todavía no está conectado a la base de datos (falta configurar CONFIG.firebase)." };
  try{
    const snap = await db.collection("orders").get();
    const taken = new Set();
    snap.forEach(doc=>{
      const o = doc.data();
      if(o.status !== "rechazado") (o.numbers||[]).forEach(n=>taken.add(n));
    });
    const conflict = order.numbers.filter(n=>taken.has(n));
    if(conflict.length){
      return { ok:false, conflict, message:"Números ya tomados: " + conflict.join(", ") };
    }
    await db.collection("orders").doc(order.id).set(order);
    return { ok:true };
  }catch(e){
    return { ok:false, message: e.message };
  }
}

async function setOrderStatusRemote(orderId, status, extra){
  const db = getDb();
  if(!db) return { ok:false, message:"El sitio todavía no está conectado a la base de datos." };
  try{
    await db.collection("orders").doc(orderId).update({ status, ...(extra||{}) });
    return { ok:true };
  }catch(e){
    return { ok:false, message: e.message };
  }
}

async function refreshData(){
  const data = await loadData();
  state.apiError = data._apiError || null;
  delete data._apiError;
  state.data = data;
}

/* =========================================================
   CONTENIDO DE LAS PLACAS (editable desde el panel admin)
========================================================= */
async function loadContentSettings(){
  const db = getDb();
  if(!db) return;
  try{
    const doc = await db.collection("settings").doc("content").get();
    if(doc.exists){
      const data = doc.data();
      if(data && Array.isArray(data.slides) && data.slides.length === CONFIG.slides.length){
        state.contentSlides = data.slides;
      }
    }
  }catch(e){
    console.warn("No se pudo cargar el contenido de las placas", e);
  }
}

async function saveContentSettings(slides){
  const db = getDb();
  if(!db) return { ok:false, message:"El sitio todavía no está conectado a la base de datos." };
  try{
    await db.collection("settings").doc("content").set({ slides });
    return { ok:true };
  }catch(e){
    return { ok:false, message: e.message };
  }
}

function effectiveSlides(){
  return state.contentSlides && state.contentSlides.length===CONFIG.slides.length ? state.contentSlides : CONFIG.slides;
}

// Redimensiona y comprime una imagen elegida por el usuario a un dataURL liviano.
function compressImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Archivo de imagen inválido."));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   RENDER: SELECT NUMBERS
========================================================= */
function filteredNumbers(){
  return NUMBERS.filter(n=>{
    if(state.search && !n.includes(state.search)) return false;
    const st = statusOf(n);
    const inCart = state.cart.includes(n);
    if(state.filterStatus==="disponibles") return st==="disponible" || inCart;
    if(state.filterStatus==="vendidos") return st==="vendido";
    if(state.filterStatus==="pendientes") return st==="pendiente";
    return true; // todos
  });
}

function renderSelectStep(){
  const list = filteredNumbers();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(state.page > totalPages) state.page = totalPages;
  const startIdx = (state.page-1)*PAGE_SIZE;
  const pageItems = list.slice(startIdx, startIdx+PAGE_SIZE);

  const soldCount = NUMBERS.filter(n=>statusOf(n)==="vendido").length;
  const pendingCount = NUMBERS.filter(n=>statusOf(n)==="pendiente").length;
  const availCount = NUMBERS.length - soldCount - pendingCount;

  const tiles = pageItems.map(n=>{
    const st = statusOf(n);
    const inCart = state.cart.includes(n);
    let cls = "num-tile";
    if(inCart) cls += " selected";
    else if(st==="vendido") cls += " sold";
    else if(st==="pendiente") cls += " pending";
    else cls += " available";
    const clickable = (st==="disponible" || inCart);
    return `<button class="${cls}" ${clickable?"":"disabled"} data-num="${n}">${n}</button>`;
  }).join("");

  const cartHtml = state.cart.length ? `
    <div class="cart-bar">
      <div class="cart-nums">Elegidos: ${state.cart.slice().sort().join(", ")}</div>
      <div style="display:flex; align-items:center; gap:16px;">
        <div class="cart-total">${state.cart.length} × ${CONFIG.priceLabel} = ${money(state.cart.length*CONFIG.price)}</div>
        <button class="btn red" id="goToBuyer">Continuar →</button>
      </div>
    </div>` : `<div class="refresh-note">Elegí uno o más números disponibles para empezar tu compra.</div>`;

  return `
    <div class="section">
      <div class="wrap">
        ${renderStepsBar()}
        <h2 class="section-title">Elegí tus números</h2>
        <div class="section-sub">Números del 0000 al 9999 · ${CONFIG.priceLabel} cada uno · ${availCount} disponibles, ${pendingCount} pendientes de pago, ${soldCount} vendidos.</div>

        <div class="legend">
          <span><span class="swatch" style="background:var(--kps-white); border-color:var(--kps-black);"></span>Disponible</span>
          <span><span class="swatch" style="background:var(--kps-blue);"></span>Elegido por vos</span>
          <span><span class="swatch" style="background:var(--kps-amber);"></span>Pendiente de verificación</span>
          <span><span class="swatch" style="background:var(--kps-charcoal);"></span>Vendido</span>
        </div>

        <div class="toolbar">
          <input class="input" id="searchNum" placeholder="Buscar número, ej: 0451" maxlength="4" value="${esc(state.search)}">
          <select id="filterStatus">
            <option value="disponibles" ${state.filterStatus==="disponibles"?"selected":""}>Ver disponibles</option>
            <option value="todos" ${state.filterStatus==="todos"?"selected":""}>Ver todos</option>
            <option value="pendientes" ${state.filterStatus==="pendientes"?"selected":""}>Ver pendientes</option>
            <option value="vendidos" ${state.filterStatus==="vendidos"?"selected":""}>Ver vendidos</option>
          </select>
          <button class="btn secondary small" id="refreshBtn">↻ Actualizar disponibilidad</button>
        </div>

        <div class="num-grid">${tiles || '<div class="refresh-note">No hay números que coincidan con la búsqueda.</div>'}</div>

        <div class="pagination">
          <button class="btn secondary small" id="prevPage" ${state.page<=1?"disabled":""}>← Anterior</button>
          <span class="mono">Página ${state.page} / ${totalPages}</span>
          <button class="btn secondary small" id="nextPage" ${state.page>=totalPages?"disabled":""}>Siguiente →</button>
        </div>

    </div>`;
}

function validateBuyer(){
  const b = state.buyer;
  const errs = {};
  if(!b.nombre.trim()) errs.nombre = true;
  if(!b.apellido.trim()) errs.apellido = true;
  if(!b.documento.trim() || b.documento.trim().length<5) errs.documento = true;
  if(!b.telefono.trim() || b.telefono.trim().length<6) errs.telefono = true;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email.trim())) errs.email = true;
  state.buyerErrors = errs;
  return Object.keys(errs).length===0;

        <div style="min-width:190px;">
          <select class="input" style="width:100%; margin-bottom:5px; font-family:'Rajdhani',sans-serif;" data-reject-reason="${o.id}">
            ${Object.entries(REJECT_REASONS).map(([k,v])=>`<option value="${k}" ${draft.reason===k?"selected":""}>${esc(v)}</option>`).join("")}
          </select>
          ${draft.reason==="otro" ? `<input class="input" style="width:100%; margin-bottom:5px;" placeholder="Detalle del motivo" data-reject-custom="${o.id}" value="${esc(draft.custom||"")}">` : ""}
          <div style="display:flex; gap:6px;">
            <button class="btn small red" data-confirm-reject="${o.id}">Confirmar anulación</button>
            <button class="btn small secondary" data-cancel-reject="${o.id}">Cancelar</button>
          </div>
        </div>`;
    } else if(o.status==="pendiente"){
      actions = `<button class="btn small blue" data-approve="${o.id}">Aprobar</button>
      <button class="btn small secondary" data-reject="${o.id}">Anular</button>`;
    } else if(o.status==="aprobado"){
      actions = `<button class="btn small secondary" data-reject="${o.id}">Anular pedido</button>`;
    } else {
      actions = `<span style="opacity:.6; font-size:12px;">—</span>`;
    }
    const reasonNote = (o.status==="rechazado" && o.rejectReason) ? `<br><span style="opacity:.6; font-size:11.5px;">${esc(o.rejectReason)}</span>` : "";
    return `
    <tr>
      <td>${esc(date)}</td>
      <td>${esc(o.buyer.nombre)} ${esc(o.buyer.apellido)}<br><span style="opacity:.6">${esc(o.buyer.documento)}</span></td>
      <td>${esc(o.buyer.telefono)}<br><span style="opacity:.6">${esc(o.buyer.email)}</span></td>
      <td class="nums">${o.numbers.slice().sort().join(", ")}</td>
      <td>${money(o.total)}</td>
      <td>${esc(payMethodLabel(o.payMethod))}<br><span style="opacity:.6">${esc(o.payReference)}</span></td>
      <td>${esc(o.buyer.vendedor||"—")}</td>
      <td><span class="status-badge ${o.status}">${statusLabel(o.status)}</span>${reasonNote}</td>
      <td style="display:flex; gap:6px; flex-wrap:wrap;">${actions}</td>
    </tr>`;
  }).join("");

  return `
      <div class="stat-grid">
        <div class="stat-card"><div class="num">${availCount}</div><div class="lbl">Disponibles</div></div>
        <div class="stat-card"><div class="num">${pendingCount}</div><div class="lbl">Pendientes</div></div>
        <div class="stat-card"><div class="num">${soldCount}</div><div class="lbl">Vendidos</div></div>
        <div class="stat-card"><div class="num">${money(recaudado)}</div><div class="lbl">Recaudado (aprobado)</div></div>
      </div>

      ${sellerSummary}

      <div class="toolbar">
        <select id="adminFilter">
          <option value="todos" ${state.admin.filter==="todos"?"selected":""}>Todos los pedidos</option>
          <option value="pendiente" ${state.admin.filter==="pendiente"?"selected":""}>Pendientes</option>
          <option value="aprobado" ${state.admin.filter==="aprobado"?"selected":""}>Aprobados</option>
          <option value="rechazado" ${state.admin.filter==="rechazado"?"selected":""}>Anulados</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Comprador</th><th>Contacto</th><th>Números</th><th>Total</th><th>Pago</th><th>Vendedor</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="9" style="text-align:center; opacity:.6;">No hay pedidos en este filtro.</td></tr>`}</tbody>
        </table>
      </div>`;
}

function exportOrdersCsv(){
  const orders = ordersList();
  const header = ["ID","Fecha","Nombre","Apellido","Documento","Telefono","Email","Localidad","Vendedor","Numeros","Total","MedioPago","Referencia","Estado","MotivoAnulacion"];
  const rows = orders.map(o=>[
    o.id, new Date(o.createdAt).toISOString(), o.buyer.nombre, o.buyer.apellido, o.buyer.documento,
    o.buyer.telefono, o.buyer.email, o.buyer.localidad||"", o.buyer.vendedor||"", o.numbers.slice().sort().join(" "),
    o.total, o.payMethod, o.payReference, o.status, o.rejectReason||""
  ]);
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "gran-rifa-kps-pedidos.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   MAIN RENDER
========================================================= */
function render(){
  const app = document.getElementById("app");

  if(location.hash === "#/admin"){
    app.innerHTML = state.admin.loggedIn ? renderAdminPanel() : renderAdminLogin();
    document.getElementById("closeBanner")?.addEventListener("click", ()=>{ state.banner=null; render(); });
    attachAdminEvents();
    return;
  }

  if(state.loading){
    app.innerHTML = `<div class="loading">Cargando disponibilidad de números…</div>`;
    return;
  }

  app.innerHTML = `
    ${renderHeader()}
    <div class="wrap" style="padding-top:${(state.banner||state.apiError)?"18px":"0"};">
      ${!apiConfigured() ? `<div class="banner info"><span>⚙️ Este sitio todavía no está conectado a la base de datos. Completá <strong>CONFIG.firebase</strong> en el archivo con los datos de tu proyecto de Firebase para que las compras se guarden de verdad.</span></div>` : ""}
      ${state.apiError && apiConfigured() ? `<div class="banner error"><span>No se pudo conectar con la base de datos: ${esc(state.apiError)}</span></div>` : ""}
      ${renderBanner()}
    </div>
    ${renderFlow()}
    <a href="#/admin" class="admin-link">Acceso administrador</a>
    <footer>Gran Rifa KPS — Karting Provincial Santafesino. El pago se valida manualmente contra el comprobante enviado.</footer>
  `;
  document.getElementById("closeBanner")?.addEventListener("click", ()=>{ state.banner=null; render(); });
  attachFlowEvents();
  attachCarouselEvents();
}

/* =========================================================
   CAROUSEL LOGIC (actualiza solo la placa, nunca el resto de la página)
========================================================= */
function updateSlideDOM(){
  document.querySelectorAll(".slide[data-slide]").forEach(el=>{
    el.classList.toggle("active", Number(el.dataset.slide)===state.slideIndex);
  });
  document.querySelectorAll(".dot[data-goto]").forEach(el=>{
    el.classList.toggle("active", Number(el.dataset.goto)===state.slideIndex);
  });
}
function goToSlide(i){
  state.slideIndex = ((i % CONFIG.slides.length) + CONFIG.slides.length) % CONFIG.slides.length;
  updateSlideDOM();
}
function startCarousel(){
  clearInterval(state.slideTimer);
  state.slideTimer = setInterval(()=>{ goToSlide(state.slideIndex+1); }, 6000);
}
function attachCarouselEvents(){
  const header = document.querySelector(".site-header");
  if(!header) return;
  header.addEventListener("mouseenter", ()=>clearInterval(state.slideTimer));
  header.addEventListener("mouseleave", startCarousel);
  document.getElementById("prevSlide")?.addEventListener("click", ()=> goToSlide(state.slideIndex-1));
  document.getElementById("nextSlide")?.addEventListener("click", ()=> goToSlide(state.slideIndex+1));
  document.querySelectorAll("[data-goto]").forEach(btn=>{
    btn.addEventListener("click", ()=> goToSlide(parseInt(btn.dataset.goto,10)));
  });
}

/* =========================================================
   FLOW EVENTS
========================================================= */
function attachFlowEvents(){
  // SELECT STEP
  document.querySelectorAll(".num-tile[data-num]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const n = btn.dataset.num;
      const idx = state.cart.indexOf(n);
      if(idx>=0) state.cart.splice(idx,1);
      else state.cart.push(n);
      render();
    });
  });
  document.getElementById("searchNum")?.addEventListener("input", (e)=>{
    state.search = e.target.value.replace(/[^0-9]/g,"").slice(0,4);
    state.page = 1;
    render();
  });
  document.getElementById("filterStatus")?.addEventListener("change", (e)=>{
    state.filterStatus = e.target.value; state.page = 1; render();
  });
  document.getElementById("refreshBtn")?.addEventListener("click", async ()=>{
    state.loading = true; render();
    await refreshData();
    state.loading = false; render();
  });
  document.getElementById("prevPage")?.addEventListener("click", ()=>{ state.page--; render(); });
  document.getElementById("nextPage")?.addEventListener("click", ()=>{ state.page++; render(); });
  document.getElementById("goToBuyer")?.addEventListener("click", ()=>{ state.step="buyer"; window.scrollTo(0,0); render(); });

  // BUYER STEP
  document.querySelectorAll("[data-field]").forEach(inp=>{
    inp.addEventListener("input", ()=>{ state.buyer[inp.dataset.field] = inp.value; });
  });
  document.getElementById("backToSelect")?.addEventListener("click", ()=>{ state.step="select"; render(); });
  document.getElementById("goToPayment")?.addEventListener("click", async ()=>{
    if(validateBuyer()){
      // re-check availability right before payment to avoid collisions
      await refreshData();
      const taken = state.cart.filter(n=>statusOf(n)!=="disponible");
      if(taken.length){
        state.cart = state.cart.filter(n=>!taken.includes(n));
        state.step="select";
        showBanner("error", "Uno o más números que elegiste ya no están disponibles (" + taken.join(", ") + "). Elegí otro número para continuar.");
        return;
      }
      state.step="payment"; window.scrollTo(0,0); render();
    } else { render(); }
  });

  // PAYMENT STEP
  document.getElementById("payMethod")?.addEventListener("change", (e)=>{ state.payMethod = e.target.value; });
  document.getElementById("payReference")?.addEventListener("input", (e)=>{ state.payReference = e.target.value; });
  document.getElementById("payConfirmed")?.addEventListener("change", (e)=>{ state.payConfirmed = e.target.checked; if(state.payConfirmed) { state.showConfirmError=false; render(); } });
  document.getElementById("backToBuyer")?.addEventListener("click", ()=>{ state.step="buyer"; render(); });
  document.getElementById("finishOrder")?.addEventListener("click", async ()=>{
    let hasError = false;
    if(!state.payReference.trim()){
      state.showRefError = true; hasError = true;
    }
    if(!state.payConfirmed){
      state.showConfirmError = true; hasError = true;
    }
    if(hasError){ render(); return; }

    const btn = document.getElementById("finishOrder");
    btn.disabled = true; btn.textContent = "Registrando…";

    try{
      await refreshData();
      const taken = state.cart.filter(n=>statusOf(n)!=="disponible");
      if(taken.length){
        state.cart = state.cart.filter(n=>!taken.includes(n));
        state.step="select";
        showBanner("error", "Uno o más números ya fueron tomados por otra persona mientras completabas el formulario (" + taken.join(", ") + "). Elegí otro número.");
        return;
      }

      const orderId = genOrderId();
      const order = {
        id: orderId,
        buyer: {...state.buyer},
        numbers: [...state.cart],
        total: state.cart.length*CONFIG.price,
        payMethod: state.payMethod,
        payReference: state.payReference.trim(),
        status: "pendiente",
        createdAt: Date.now()
      };
      const res = await createOrderRemote(order);
      if(!res.ok){
        if(res.conflict && res.conflict.length){
          state.cart = state.cart.filter(n=>!res.conflict.includes(n));
          state.step="select";
          showBanner("error", "Uno o más números ya fueron tomados por otra persona mientras completabas el formulario (" + res.conflict.join(", ") + "). Elegí otro número.");
          return;
        }
        showBanner("error", "No se pudo guardar tu registro: " + res.message);
        if(btn){ btn.disabled=false; btn.textContent="Finalizar registro"; }
        return;
      }
      state.lastOrder = order;
      state.cart = [];
      state.buyer = { nombre:"", apellido:"", documento:"", telefono:"", email:"", localidad:"", vendedor:"" };
      state.payReference = ""; state.payConfirmed = false; state.showRefError=false; state.showConfirmError=false;
      state.banner = null;
      state.step = "confirm";
      window.scrollTo(0,0);
      render();
    }catch(err){
      console.error(err);
      showBanner("error", "Ocurrió un problema al finalizar el registro (" + (err && err.message ? err.message : "error desconocido") + "). Probá de nuevo.");
    }
  });

  // CONFIRM STEP
  document.getElementById("newOrder")?.addEventListener("click", async ()=>{
    state.step="select";
    state.banner = null;
    await refreshData();
    render();
  });
}

/* =========================================================
   ADMIN EVENTS
========================================================= */
function attachAdminEvents(){
  document.getElementById("backHomeFromLogin")?.addEventListener("click", (e)=>{
    e.preventDefault(); location.hash = "#/"; render();
  });
  document.getElementById("adminPass")?.addEventListener("input", (e)=>{ state.admin.passInput = e.target.value; });
  document.getElementById("adminPass")?.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doAdminLogin(); });
  document.getElementById("adminLoginBtn")?.addEventListener("click", doAdminLogin);

  document.getElementById("adminLogout")?.addEventListener("click", ()=>{
    state.admin.loggedIn = false; state.admin.passInput=""; location.hash="#/"; render();
  });
  document.getElementById("adminRefresh")?.addEventListener("click", async ()=>{
    await refreshData();
    if(state.admin.view==="content") await loadContentSettings();
    render();
  });
  document.querySelectorAll("[data-admin-view]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      state.admin.view = btn.dataset.adminView;
      if(state.admin.view === "content"){
        await loadContentSettings();
        state.admin.slideDrafts = JSON.parse(JSON.stringify(effectiveSlides()));
      }
      render();
    });
  });
  document.querySelectorAll("[data-slide-field]").forEach(el=>{
    el.addEventListener("input", (e)=>{
      const [idx, field] = e.target.dataset.slideField.split(":");
      const draft = state.admin.slideDrafts[Number(idx)];
      if(field === "prizes"){
        draft.prizes = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean);
      } else {
        draft[field] = e.target.value;
      }
    });
  });
  document.querySelectorAll("[data-slide-photo]").forEach(el=>{
    el.addEventListener("change", async (e)=>{
      const idx = Number(e.target.dataset.slidePhoto);
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImageFile(file, 640);
        state.admin.slideDrafts[idx].imageDataUrl = dataUrl;
        render();
      }catch(err){
        showBanner("error", "No se pudo procesar la imagen: " + err.message);
      }
    });
  });
  document.querySelectorAll("[data-slide-photo-clear]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.slidePhotoClear);
      delete state.admin.slideDrafts[idx].imageDataUrl;
      render();
    });
  });
  document.getElementById("saveContent")?.addEventListener("click", async ()=>{
    state.admin.savingContent = true; render();
    const res = await saveContentSettings(state.admin.slideDrafts);
    state.admin.savingContent = false;
    if(!res.ok){
      showBanner("error", "No se pudieron guardar los cambios: " + res.message);
    } else {
      state.contentSlides = JSON.parse(JSON.stringify(state.admin.slideDrafts));
      showBanner("info", "Cambios guardados. Ya se ven en el sitio.");
    }
    render();
  });
  document.getElementById("resetContentDrafts")?.addEventListener("click", ()=>{
    state.admin.slideDrafts = JSON.parse(JSON.stringify(effectiveSlides()));
    render();
  });
  document.getElementById("adminFilter")?.addEventListener("change", (e)=>{
    state.admin.filter = e.target.value; render();
  });
  document.getElementById("exportCsv")?.addEventListener("click", exportOrdersCsv);

  document.querySelectorAll("[data-approve]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.dataset.approve;
      btn.disabled = true; btn.textContent = "Guardando…";
      const res = await setOrderStatusRemote(id, "aprobado");
      if(!res.ok){ showBanner("error", "No se pudo guardar: " + res.message); }
      await refreshData();
      render();
    });
  });
  document.querySelectorAll("[data-reject]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.admin.rejectDraft = { orderId: btn.dataset.reject, reason:"falta_pago", custom:"" };
      render();
    });
  });
  document.querySelectorAll("[data-cancel-reject]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.admin.rejectDraft = null;
      render();
    });
  });
  document.querySelectorAll("[data-reject-reason]").forEach(sel=>{
    sel.addEventListener("change", (e)=>{
      if(state.admin.rejectDraft) state.admin.rejectDraft.reason = e.target.value;
      render();
    });
  });
  document.querySelectorAll("[data-reject-custom]").forEach(inp=>{
    inp.addEventListener("input", (e)=>{
      if(state.admin.rejectDraft) state.admin.rejectDraft.custom = e.target.value;
    });
  });
  document.querySelectorAll("[data-confirm-reject]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const draft = state.admin.rejectDraft;
      if(!draft) return;
      const id = draft.orderId;
      const reasonLabel = draft.reason==="otro" ? (draft.custom.trim() || "Otro motivo") : REJECT_REASONS[draft.reason];
      state.admin.rejectDraft = null;
      btn.disabled = true; btn.textContent = "Guardando…";
      const res = await setOrderStatusRemote(id, "rechazado", { rejectReason: reasonLabel });
      if(!res.ok){ showBanner("error", "No se pudo guardar: " + res.message); }
      await refreshData();
      render();
    });
  });
}

async function doAdminLogin(){
  if(state.admin.passInput === CONFIG.adminPassword){
    state.admin.loggedIn = true; state.admin.error = "";
    render(); // muestra el panel ya, mientras carga
    await refreshData();
    render();
  } else {
    state.admin.error = "Clave incorrecta. Intentá de nuevo.";
    render();
  }
}

/* =========================================================
   BOOT
========================================================= */
window.addEventListener("hashchange", async ()=>{
  if(location.hash === "#/admin" && state.admin.loggedIn){
    await refreshData();
  }
  render();
});

(async function boot(){
  render();
  await Promise.all([ refreshData(), loadContentSettings() ]);
  state.loading = false;
  render();
  startCarousel();
})();
</script>
</body>
</html>
