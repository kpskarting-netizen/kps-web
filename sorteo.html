<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sorteador — Gran Rifa KPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --black:#0b0b0d; --charcoal:#1c1c20; --panel:#16161a; --line:#2e2e33;
    --red:#e2231a; --blue:#1e8fc7; --white:#f4f4f1; --amber:#f0a825; --grey:#9a9aa2; --green:#25d366;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--black); color:var(--white); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
  h1,h2,h3{font-family:'Anton',sans-serif; letter-spacing:.02em; text-transform:uppercase; margin:0; font-weight:400;}
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:'Rajdhani',sans-serif; cursor:pointer;}
  .stripes{height:14px; background:linear-gradient(var(--red) 0 38%, var(--white) 38% 62%, var(--blue) 62% 100%);}
  .wrap{max-width:1100px; margin:0 auto; padding:24px 16px 60px;}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:22px;}
  header.top h1{font-size:34px;}
  header.top h1 span{color:var(--amber);}
  .eyebrow{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.2em; font-size:13px; color:var(--grey); text-transform:uppercase;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .btn{border:0; border-radius:10px; padding:12px 20px; font-size:18px; font-weight:700; letter-spacing:.04em; background:var(--white); color:var(--black); text-transform:uppercase;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.red{background:var(--red); color:#fff;}
  .btn.blue{background:var(--blue); color:#fff;}
  .btn.amber{background:var(--amber); color:var(--black);}
  .btn.ghost{background:transparent; color:var(--white); border:1px solid var(--line);}
  .btn.green{background:var(--green); color:var(--black);}
  .btn.small{font-size:15px; padding:8px 14px;}
  .btn.big{font-size:26px; padding:18px 34px; border-radius:14px;}
  input,select{font-family:'Inter',sans-serif; font-size:16px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--black); color:var(--white);}
  label{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:var(--grey); display:block; margin-bottom:6px; letter-spacing:.04em;}
  .msg{border-radius:10px; padding:12px 14px; margin:14px 0; font-size:15px; line-height:1.45;}
  .msg.warn{background:rgba(240,168,37,.12); border:1px solid rgba(240,168,37,.5); color:#ffd27a;}
  .msg.err{background:rgba(226,35,26,.14); border:1px solid rgba(226,35,26,.6); color:#ff9b95;}
  .msg.ok{background:rgba(37,211,102,.1); border:1px solid rgba(37,211,102,.5); color:#8ff0b5;}
  .muted{color:var(--grey);}

  /* login */
  .login{max-width:420px; margin:12vh auto 0; text-align:center;}
  .login input{width:100%; margin:16px 0 12px; text-align:center; font-size:20px;}

  /* draw tabs */
  .tabs{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
  .tab{background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:14px; text-align:left; color:var(--white);}
  .tab .t{font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; display:block;}
  .tab .d{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:var(--grey);}
  .tab .s{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.08em; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:4px; background:var(--line); color:var(--grey);}
  .tab .s.done{background:var(--green); color:var(--black);}
  .tab.active{border-color:var(--amber);}
  .setup{display:grid; grid-template-columns:1.1fr 1fr; gap:16px;}
  .prizes{list-style:none; padding:0; margin:12px 0 0;}
  .prizes li{display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px;}
  .prizes li:last-child{border-bottom:0;}
  .medal{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-family:'Anton',sans-serif; font-size:20px; flex-shrink:0;}
  .m1{background:var(--amber); color:var(--black);} .m2{background:var(--blue);} .m3{background:var(--red);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; max-height:220px; overflow:auto;}
  .chip{font-family:'Space Mono',monospace; font-weight:700; font-size:14px; padding:4px 8px; border-radius:6px; background:var(--white); color:var(--black);}
  .bigcount{font-family:'Anton',sans-serif; font-size:56px; line-height:1; color:var(--amber);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:end;}

  /* stage */
  .stage{position:relative; text-align:center; padding:34px 20px 40px; border-radius:18px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, rgba(226,35,26,.28), transparent 65%), var(--charcoal); border:1px solid var(--line);}
  .stage:fullscreen{border-radius:0; display:flex; flex-direction:column; justify-content:center; padding:40px;}
  .stage .which{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.25em; color:var(--amber); font-size:18px;}
  .stage .prize-now{font-family:'Anton',sans-serif; font-size:clamp(28px,5vw,54px); text-transform:uppercase; margin:6px 0 18px;}
  .drum{display:inline-flex; gap:10px; margin:6px 0 14px;}
  .digit{width:clamp(64px,13vw,150px); height:clamp(92px,19vw,210px); background:var(--white); color:var(--black); border-radius:14px;
    display:grid; place-items:center; font-family:'Space Mono',monospace; font-weight:700; font-size:clamp(54px,11vw,140px); box-shadow:0 10px 0 #b9b9b4 inset, 0 8px 30px rgba(0,0,0,.5);}
  .digit.spin{color:#555;}
  .winner-name{font-family:'Anton',sans-serif; font-size:clamp(30px,6vw,64px); text-transform:uppercase; min-height:1.2em; color:var(--white);}
  .winner-sub{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:22px; color:var(--grey); min-height:1.3em;}
  .pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1}}
  .stage .actions{margin-top:24px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .fsbtn{position:absolute; right:14px; top:14px;}
  .confetti{position:absolute; inset:0; pointer-events:none;}

  /* results */
  .results{margin-top:22px;}
  .wcard{display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .wcard .num{font-family:'Space Mono',monospace; font-weight:700; font-size:34px; background:var(--white); color:var(--black); border-radius:10px; padding:6px 12px;}
  .wcard h3{font-size:24px;}
  .wcard .pz{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; color:var(--amber);}
  .wcard .ct{font-size:14px; color:var(--grey); margin-top:4px; line-height:1.5;}
  .wcard .btns{display:flex; flex-direction:column; gap:8px;}
  textarea{width:100%; min-height:150px; font-family:'Inter',sans-serif; font-size:15px; background:var(--black); color:var(--white); border:1px solid var(--line); border-radius:10px; padding:12px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:8px; border-bottom:1px solid var(--line);}
  th{font-family:'Rajdhani',sans-serif; color:var(--grey); letter-spacing:.06em;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--white); color:var(--black); padding:10px 18px; border-radius:10px; font-weight:600; z-index:99; display:none;}

  @media (max-width:760px){
    .tabs{grid-template-columns:1fr;}
    .setup{grid-template-columns:1fr;}
    .wcard{grid-template-columns:1fr;}
  }
  @media print{
    body{background:#fff; color:#000;}
    .noprint, .stage, .tabs, .setup, header.top .btn{display:none !important;}
    .card,.wcard{background:#fff; border-color:#ccc; color:#000;}
    .wcard .pz{color:#000;} .wcard .ct{color:#333;}
  }
</style>

<body>
<div class="stripes"></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SORTEADOR — GRAN RIFA KPS
   Usa la misma base de Firebase que rifa.html.
   - Participan solo las compras APROBADAS (pago validado).
   - Sorteos de octubre y noviembre: solo números comprados
     hasta la fecha/hora de corte.
   - Sorteo final: TODOS los números aprobados.
   - Un mismo número no puede ganar dos premios en el mismo sorteo.
   - El resultado se guarda en settings/sorteo_<octubre|noviembre|final>
     (solo número, nombre y premio; el contacto se lee de la compra).
========================================================= */
const ADMIN_PASSWORD = "KPS2026"; // misma clave que el panel de la rifa

const FIREBASE = {
  apiKey: "AIzaSyAplAcQP22J8naIE7SFUTOCfxjH4OLdp-E",
  authDomain: "gran-rifa-kps.firebaseapp.com",
  projectId: "gran-rifa-kps",
  storageBucket: "gran-rifa-kps.firebasestorage.app",
  messagingSenderId: "343696537914",
  appId: "1:343696537914:web:5d84dd0e455a532b227803"
};

// Sorteos. Las fechas y premios se toman de la web (placas); estos son los valores de respaldo.
const DRAWS = [
  { key:"october",  title:"Sorteo de Octubre",  short:"Octubre",  date:"25/10", allNumbers:false,
    prizes:["Pistola de calor - Crossmaster","Almuerzo para dos personas en la Vera","Remera KPS"] },
  { key:"november", title:"Sorteo de Noviembre", short:"Noviembre", date:"28/11", allNumbers:false,
    prizes:["Pistola de calor - Crossmaster","Almuerzo para dos personas en la Vera","Remera KPS"] },
  { key:"december", title:"Sorteo Final — Diciembre", short:"Final", date:"14/12", allNumbers:true,
    prizes:["Un viaje a TEMAIKEN para dos personas","Dos pasajes ida y vuelta a Cordoba o Carlos Paz desde Santa Fe","Soldadora Electrica - Dowen paggio"] }
];
const PLACE = ["1er premio","2do premio","3er premio"];
const DRAW_ORDER = [2,1,0]; // se sortea del 3er premio al 1ro

/* ---------------- estado ---------------- */
const S = {
  logged: sessionStorage.getItem("kps-sorteo-ok")==="1",
  loading: false, error: null,
  orders: [],            // órdenes aprobadas
  pendingCount: 0,
  saved: {},             // resultados guardados por key
  current: "october",
  cutoff: {},            // key -> datetime-local string
  run: null,             // sorteo en curso {key, participants, results:[], step}
  test: false            // modo prueba: no guarda el resultado
};

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display="none",2200); }
function pad(n){ return String(n).padStart(2,"0"); }
function toLocalInput(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtDate(ms){ return new Date(ms).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function fullName(b){ return ((b.nombre||"")+" "+(b.apellido||"")).trim() || "(sin nombre)"; }
function firstName(b){ return (b.nombre||"").trim().split(/\s+/)[0] || ""; }
function cleanPrize(p){ return String(p||"").replace(/^\s*\d+\s*(er|do|ro|to|°|º)?\s*premio\s*:\s*/i,"").trim(); }

// Número aleatorio uniforme con el generador criptográfico del navegador
function randomIndex(n){
  const max = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= max);
  return buf[0] % n;
}

// Teléfono -> número para WhatsApp (Argentina)
function waNumber(tel){
  let d = String(tel||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("549")) return d;
  if(d.startsWith("54")) d = d.slice(2);
  if(d.startsWith("0")) d = d.slice(1);
  if(d.length === 12){ // código de área + 15 + número
    for(const a of [3,2,4]){ if(d.substr(a,2)==="15"){ d = d.slice(0,a)+d.slice(a+2); break; } }
  }
  return d.length===10 ? "549"+d : "";
}

/* ---------------- Firebase ---------------- */
let _db=null;
function db(){
  if(_db) return _db;
  if(typeof firebase==="undefined") throw new Error("No se pudo cargar Firebase (revisá la conexión a internet).");
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE);
  _db = firebase.firestore(); return _db;
}

async function loadAll(){
  S.loading=true; S.error=null; render();
  try{
    const snap = await db().collection("orders").get();
    const orders=[]; let pend=0;
    snap.forEach(doc=>{ const o=doc.data(); o.id=o.id||doc.id;
      if(o.status==="aprobado") orders.push(o);
      else if(o.status!=="rechazado") pend++;
    });
    S.orders = orders; S.pendingCount = pend;

    // premios y fechas desde las placas de la web
    try{
      const c = await db().collection("settings").doc("content").get();
      const slides = c.exists && c.data() && c.data().slides;
      if(Array.isArray(slides)){
        DRAWS.forEach(dr=>{
          const sl = slides.find(s=>s.key===dr.key); if(!sl) return;
          if(Array.isArray(sl.prizes) && sl.prizes.length) dr.prizes = sl.prizes.map(cleanPrize);
          const m = String(sl.sub||"").match(/(\d{1,2}\/\d{1,2}(\/\d{2,4})?)/); if(m) dr.date = m[1];
        });
      }
    }catch(e){ console.warn("No se pudieron leer los premios de la web", e); }

    // resultados ya guardados (settings/sorteo_<key>)
    for(const dr of DRAWS){
      try{
        const d = await db().collection("settings").doc("sorteo_"+dr.key).get();
        if(d.exists && d.data() && Array.isArray(d.data().results)) S.saved[dr.key]=d.data();
      }catch(e){ console.warn("No se pudo leer el sorteo guardado", dr.key, e); }
    }
    // respaldo local (por si no se pudo guardar en la base)
    DRAWS.forEach(dr=>{
      if(S.saved[dr.key]) return;
      try{ const l=localStorage.getItem("kps-sorteo-"+dr.key); if(l) S.saved[dr.key]=JSON.parse(l); }catch(_){}
    });
  }catch(e){
    S.error = "No se pudo conectar con la base de datos: " + e.message;
  }
  S.loading=false; render();
}

async function saveResult(rec){
  try{ localStorage.setItem("kps-sorteo-"+rec.key, JSON.stringify(rec)); }catch(_){}
  // En la base solo se guarda número, nombre y premio (sin DNI/teléfono/email):
  // los datos de contacto se toman de la compra (orderId) al mostrar los ganadores.
  const pub = { ...rec, results: rec.results.map(w=>({ place:w.place, prizeLabel:w.prizeLabel, prize:w.prize, number:w.number,
    orderId:w.orderId, nombre:w.nombre, apellido:w.apellido, localidad:w.localidad, drawnAt:w.drawnAt })) };
  try{
    await db().collection("settings").doc("sorteo_"+rec.key).set(pub);
    return { ok:true };
  }catch(e){
    return { ok:false, message:e.message };
  }
}

/* ---------------- lógica del sorteo ---------------- */
function drawDef(key){ return DRAWS.find(d=>d.key===key); }

function defaultCutoff(dr){
  // por defecto: el momento actual (se usa al hacer el sorteo en vivo)
  return toLocalInput(new Date());
}

function participantsFor(dr){
  const cutoffStr = S.cutoff[dr.key] || defaultCutoff(dr);
  const cutoffMs = dr.allNumbers ? Infinity : new Date(cutoffStr).getTime();
  const list=[];
  S.orders.forEach(o=>{
    if(!(o.createdAt <= cutoffMs)) return;
    (o.numbers||[]).forEach(n=> list.push({ number:String(n), order:o }));
  });
  list.sort((a,b)=> a.number.localeCompare(b.number));
  return { list, cutoffMs, cutoffStr };
}

function startRun(){
  const dr = drawDef(S.current);
  const { list, cutoffMs } = participantsFor(dr);
  if(!list.length){ toast("No hay números aprobados para este sorteo"); return; }
  S.run = { key:dr.key, participants:list, cutoffMs, results:[], stepIdx:0, spinning:false, saved:null, test:S.test };
  render();
  setTimeout(()=>{ const st=$("#stage"); if(st) st.scrollIntoView({behavior:"smooth", block:"start"}); }, 50);
}

function nextPrizeIdx(){
  const r=S.run; if(!r) return null;
  return r.stepIdx < DRAW_ORDER.length ? DRAW_ORDER[r.stepIdx] : null;
}

async function drawNext(){
  const r=S.run, dr=drawDef(r.key);
  const pIdx = nextPrizeIdx(); if(pIdx==null || r.spinning) return;
  const used = new Set(r.results.map(x=>x.number));
  const pool = r.participants.filter(p=>!used.has(p.number));
  if(!pool.length){ toast("No quedan números para sortear"); return; }
  const win = pool[randomIndex(pool.length)];
  r.spinning=true; render();
  await spinTo(win.number, r.participants.map(p=>p.number));
  r.results.push({
    place:pIdx+1, prizeLabel:PLACE[pIdx], prize:dr.prizes[pIdx]||"",
    number:win.number, orderId:win.order.id,
    nombre:win.order.buyer.nombre||"", apellido:win.order.buyer.apellido||"",
    documento:win.order.buyer.documento||"", telefono:win.order.buyer.telefono||"",
    email:win.order.buyer.email||"", localidad:win.order.buyer.localidad||"",
    vendedor:win.order.buyer.vendedor||"", drawnAt:Date.now()
  });
  r.stepIdx++; r.spinning=false; r.lastWin = r.results[r.results.length-1];
  if(r.stepIdx>=DRAW_ORDER.length || r.results.length>=r.participants.length){ await finishRun(); }
  render(); confetti();
}

async function finishRun(){
  const r=S.run, dr=drawDef(r.key);
  const rec = {
    key:dr.key, title:dr.title, date:dr.date, drawnAt:Date.now(),
    cutoff: dr.allNumbers ? null : r.cutoffMs,
    participantsCount:r.participants.length,
    participants:r.participants.map(p=>p.number),
    results:[...r.results].sort((a,b)=>a.place-b.place)
  };
  r.rec=rec; r.done=true;
  if(r.test){ r.saved={ ok:true, test:true }; return; }
  r.saved = await saveResult(rec);
  S.saved[dr.key]=rec;
}

/* animación tipo bolillero */
function spinTo(target, pool){
  return new Promise(resolve=>{
    const digits=[...document.querySelectorAll(".digit")];
    const total=4200; const t0=performance.now(); let last=0;
    function frame(now){
      const t=now-t0;
      const p=Math.min(1,t/total);
      const interval = 40 + 360*Math.pow(p,2.4);
      if(now-last>interval){
        last=now;
        const pick = pool[Math.floor(Math.random()*pool.length)];
        // cada dígito se va fijando de izquierda a derecha en el último tramo
        digits.forEach((el,i)=>{
          const lockAt = 0.62 + i*0.1;
          if(p>=lockAt){ el.textContent=target[i]; el.classList.remove("spin"); }
          else { el.textContent = Math.random()<.5 ? pick[i] : Math.floor(Math.random()*10); el.classList.add("spin"); }
        });
      }
      if(p<1) requestAnimationFrame(frame);
      else { digits.forEach((el,i)=>{ el.textContent=target[i]; el.classList.remove("spin"); }); setTimeout(resolve,250); }
    }
    requestAnimationFrame(frame);
  });
}

function confetti(){
  const st=$("#stage"); if(!st) return;
  const c=document.createElement("canvas"); c.className="confetti"; st.appendChild(c);
  const w=c.width=st.clientWidth, h=c.height=st.clientHeight, x=c.getContext("2d");
  const cols=["#e2231a","#1e8fc7","#f4f4f1","#f0a825"];
  const ps=Array.from({length:140},()=>({x:w/2,y:h*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
  let f=0; (function loop(){ x.clearRect(0,0,w,h); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2; x.fillStyle=p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-p.r,-p.r/2,p.r*2,p.r); x.restore();}); if(++f<110) requestAnimationFrame(loop); else c.remove(); })();
}

/* ---------------- mensajes ---------------- */
function winnerMessage(w, rec){
  const n = firstName(w);
  return `¡Hola${n?" "+n:""}! 🏁 Te escribimos de KPS – Karting Provincial Santafesino.\n\n` +
    `¡FELICITACIONES! 🎉 Tu número *${w.number}* salió sorteado en el *${rec.title}* de la Gran Rifa KPS` + (rec.date?` (${rec.date})`:"") +
    ` y ganaste el *${w.prizeLabel}*: *${w.prize}*.\n\n` +
    `Respondenos este mensaje para coordinar la entrega del premio. ¡Gracias por apoyar al karting!`;
}
function announcement(rec){
  const lines = [...rec.results].sort((a,b)=>a.place-b.place).map(w=>`${w.place===1?"🥇":w.place===2?"🥈":"🥉"} ${w.prizeLabel} — ${w.prize}\n    N° ${w.number} · ${fullName(w)}${w.localidad?" ("+w.localidad+")":""}`);
  return `🏁 GRAN RIFA KPS — ${rec.title.toUpperCase()}${rec.date?" ("+rec.date+")":""}\n\n¡Estos son los ganadores!\n\n${lines.join("\n\n")}\n\n` +
    `Participaron ${rec.participantsCount} números. ¡Felicitaciones y gracias a todos por acompañar al karting! Los ganadores serán contactados para coordinar la entrega.`;
}
function copy(text){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast("Copiado ✔")).catch(()=>{
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copiado ✔");
  });
}
function downloadCSV(rec){
  const head=["Sorteo","Fecha sorteo","Premio","Detalle premio","Numero","Nombre","Apellido","DNI","Telefono","Email","Localidad","Vendedor","ID compra"];
  const rows=sortedWinners(rec).map(w=>[rec.title,rec.date,w.prizeLabel,w.prize,w.number,w.nombre,w.apellido,w.documento,w.telefono,w.email,w.localidad,w.vendedor,w.orderId]);
  const csv="﻿"+[head,...rows].map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`ganadores-${rec.key}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------------- vistas ---------------- */
function render(){
  const app=$("#app");
  if(!S.logged){ app.innerHTML=viewLogin(); bindLogin(); return; }
  app.innerHTML = viewHeader() + (S.loading ? `<p class="muted">Cargando números vendidos…</p>` :
    S.error ? `<div class="msg err">${esc(S.error)}</div><button class="btn" onclick="loadAll()">Reintentar</button>` : viewMain());
}

function viewLogin(){
  return `<div class="login card">
    <div class="eyebrow">Gran Rifa KPS</div>
    <h1 style="font-size:40px; margin-top:6px;">Sorteador</h1>
    <input type="password" id="pw" placeholder="Clave de administrador" autocomplete="current-password">
    <button class="btn red" id="pwb" style="width:100%;">Entrar</button>
    <div id="pwe" class="msg err" style="display:none;">Clave incorrecta</div>
  </div>`;
}
function bindLogin(){
  const go=()=>{ if($("#pw").value===ADMIN_PASSWORD){ S.logged=true; sessionStorage.setItem("kps-sorteo-ok","1"); loadAll(); } else $("#pwe").style.display="block"; };
  $("#pwb").onclick=go; $("#pw").onkeydown=e=>{ if(e.key==="Enter") go(); }; $("#pw").focus();
}

function viewHeader(){
  return `<header class="top">
    <div><div class="eyebrow">Gran Rifa KPS · Panel de sorteo</div><h1>Sorteador <span>KPS</span></h1></div>
    <div class="row noprint"><button class="btn ghost small" onclick="reloadData()" ${S.run&&!S.run.done?"disabled":""}>↻ Actualizar datos</button></div>
  </header>`;
}

function viewMain(){
  const dr=drawDef(S.current);
  let h = `<div class="tabs noprint">` + DRAWS.map(d=>{
    const done=!!S.saved[d.key];
    return `<button class="tab ${d.key===S.current?"active":""}" onclick="selectDraw('${d.key}')" ${S.run&&!S.run.done?"disabled":""}>
      <span class="t">${esc(d.short)}</span><span class="d">${esc(d.title)} · ${esc(d.date)}</span><br>
      <span class="s ${done?"done":""}">${done?"✔ SORTEADO":"PENDIENTE"}</span></button>`;
  }).join("") + `</div>`;

  const saved=S.saved[dr.key];
  if(S.run && S.run.key===dr.key){
    h += viewStage(dr);
    if(S.run.done) h += viewResults(S.run.rec, S.run.saved);
  } else if(saved){
    h += `<div class="msg ok noprint">Este sorteo ya se realizó el ${esc(fmtDate(saved.drawnAt))} con ${saved.participantsCount} números participantes. Abajo tenés los ganadores para comunicarles el premio.</div>`;
    h += viewResults(saved, null);
    h += `<div class="card noprint" style="margin-top:22px;"><h3 style="font-size:20px;">¿Hubo un error?</h3>
      <p class="muted" style="margin:8px 0 12px;">Repetir el sorteo reemplaza los ganadores guardados. Hacelo solo si hubo un problema real (por ejemplo, faltaba aprobar pagos) y avisá públicamente.</p>
      <button class="btn ghost small" onclick="redo()">Repetir este sorteo</button></div>`;
  } else {
    h += viewSetup(dr);
  }
  return h;
}

function viewSetup(dr){
  if(!S.cutoff[dr.key]) S.cutoff[dr.key]=defaultCutoff(dr);
  const { list } = participantsFor(dr);
  const enough = list.length >= 3;
  return `<div class="setup">
    <div class="card">
      <div class="eyebrow">${esc(dr.title)} · ${esc(dr.date)}</div>
      <h2 style="font-size:28px; margin-top:4px;">Premios</h2>
      <ul class="prizes">${dr.prizes.map((p,i)=>`<li><span class="medal m${i+1}">${i+1}</span>${esc(p)}</li>`).join("")}</ul>
      <p class="muted" style="margin:14px 0 0; font-size:14px;">Se sortea en este orden: 3er premio → 2do premio → 1er premio. Un número no puede ganar dos premios en el mismo sorteo.</p>
    </div>
    <div class="card">
      <div class="eyebrow">Números que participan</div>
      <div class="row" style="margin:8px 0 4px; align-items:center;"><span class="bigcount">${list.length}</span><span class="muted">números vendidos y con pago aprobado</span></div>
      ${dr.allNumbers ? `<p class="muted" style="font-size:14px; margin:6px 0 0;">En el sorteo final juegan <b>todos</b> los números vendidos durante toda la rifa.</p>` :
      `<div style="margin-top:12px;"><label for="cut">Comprados hasta (fecha y hora de corte)</label>
        <input type="datetime-local" id="cut" value="${esc(S.cutoff[dr.key])}" onchange="setCutoff(this.value)"></div>
       <p class="muted" style="font-size:13px; margin:6px 0 0;">Solo participan las compras hechas hasta este momento. Por defecto es ahora.</p>`}
      ${S.pendingCount ? `<div class="msg warn">Hay <b>${S.pendingCount}</b> compra(s) con pago <b>pendiente de verificación</b> que NO participan. Si ya pagaron, aprobalas en el panel de la rifa y tocá “Actualizar datos” antes de sortear.</div>`:""}
      ${!enough && list.length ? `<div class="msg warn">Hay menos números que premios: se sortearán solo ${list.length} premio(s).</div>`:""}
      <div class="chips">${list.map(p=>`<span class="chip" title="${esc(fullName(p.order.buyer))}">${esc(p.number)}</span>`).join("")}</div>
    </div>
  </div>
  <div style="text-align:center; margin-top:22px;">
    <label style="display:inline-flex; gap:8px; align-items:center; cursor:pointer; margin-bottom:14px; color:var(--white); font-size:17px;">
      <input type="checkbox" id="testmode" ${S.test?"checked":""} onchange="S.test=this.checked; render();" style="width:20px; height:20px;">
      Sorteo de prueba (para practicar: no se guarda)</label><br>
    <button class="btn ${S.test?"amber":"red"} big" onclick="startRun()" ${list.length?"":"disabled"}>${S.test?"Comenzar sorteo de prueba":"Comenzar sorteo"}</button>
  </div>`;
}

function viewStage(dr){
  const r=S.run;
  const pIdx = nextPrizeIdx();
  const showIdx = r.spinning ? pIdx : (r.lastWin ? r.lastWin.place-1 : pIdx);
  const lw = !r.spinning && r.lastWin;
  const num = lw ? lw.number : "????";
  return `<div class="stage" id="stage">
    <button class="btn ghost small fsbtn noprint" onclick="fullscreen()">⛶ Pantalla completa</button>
    ${r.test?`<div class="msg warn" style="display:inline-block; margin:0 0 10px;">SORTEO DE PRUEBA — no se guarda</div>`:""}
    <div class="which">GRAN RIFA KPS · ${esc(dr.title.toUpperCase())}</div>
    <div class="prize-now">${showIdx!=null ? esc(PLACE[showIdx])+": "+esc(dr.prizes[showIdx]||"") : "¡Sorteo terminado!"}</div>
    <div class="drum">${[...num].map(c=>`<div class="digit ${lw?"pop":""}">${esc(c)}</div>`).join("")}</div>
    <div class="winner-name ${lw?"pop":""}">${lw?esc(fullName(lw)):""}</div>
    <div class="winner-sub">${lw?esc([lw.localidad].filter(Boolean).join(" · ")):(r.spinning?"Sorteando…":r.participants.length+" números participando")}</div>
    <div class="actions noprint">
      ${r.done ? "" : r.spinning ? "" :
        `<button class="btn amber big" onclick="drawNext()">Sortear ${esc(PLACE[pIdx])}</button>`}
    </div>
    ${r.results.length ? `<div style="margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">${[...r.results].sort((a,b)=>a.place-b.place).map(w=>`<span class="chip" style="font-size:16px;">${w.place}° · ${esc(w.number)} · ${esc(fullName(w))}</span>`).join("")}</div>`:""}
  </div>`;
}

function withContact(w){
  const o = S.orders.find(o=>o.id===w.orderId);
  if(!o || !o.buyer) return w;
  const b=o.buyer;
  return { ...w, documento:w.documento||b.documento||"", telefono:w.telefono||b.telefono||"", email:w.email||b.email||"",
    localidad:w.localidad||b.localidad||"", vendedor:w.vendedor||b.vendedor||"" };
}
function sortedWinners(rec){ return [...rec.results].sort((a,b)=>a.place-b.place).map(withContact); }

function viewResults(rec, saveRes){
  if(!rec) return "";
  const res=sortedWinners(rec);
  let h = `<div class="results" id="results">`;
  if(saveRes && saveRes.test) h += `<div class="msg warn noprint"><b>Sorteo de PRUEBA:</b> este resultado no se guardó y no vale. Elegí otro sorteo o tocá “Actualizar datos” para volver a empezar.</div>`;
  else if(saveRes && !saveRes.ok) h += `<div class="msg warn noprint">El resultado quedó guardado en esta computadora, pero no se pudo guardar en la base de datos (${esc(saveRes.message)}). Descargá la lista de ganadores para tenerla a resguardo.</div>`;
  else if(saveRes && saveRes.ok) h += `<div class="msg ok noprint">Resultado guardado. Si volvés a abrir el sorteador vas a ver estos mismos ganadores.</div>`;
  h += `<div class="row" style="justify-content:space-between; margin:6px 0 14px;"><h2 style="font-size:30px;">Ganadores · ${esc(rec.title)}</h2>
    <div class="row noprint"><button class="btn small" onclick="downloadCSV(getRec('${rec.key}'))">Descargar lista (Excel)</button><button class="btn ghost small" onclick="window.print()">Imprimir</button></div></div>
    <p class="muted" style="margin:-6px 0 14px; font-size:14px;">Sorteado el ${esc(fmtDate(rec.drawnAt))} · ${rec.participantsCount} números participantes${rec.cutoff?` (compras hasta el ${esc(fmtDate(rec.cutoff))})`:" (todos los números vendidos)"}</p>`;
  res.forEach((w,i)=>{
    const wa=waNumber(w.telefono);
    const msg=winnerMessage(w,rec);
    h += `<div class="wcard">
      <div class="num">${esc(w.number)}</div>
      <div><div class="pz">${esc(w.prizeLabel)} · ${esc(w.prize)}</div><h3>${esc(fullName(w))}</h3>
        <div class="ct">DNI ${esc(w.documento||"—")} · Tel. ${esc(w.telefono||"—")}${w.email?" · "+esc(w.email):""}${w.localidad?" · "+esc(w.localidad):""}${w.vendedor?"<br>Vendedor: "+esc(w.vendedor):""}</div></div>
      <div class="btns noprint">
        ${wa ? `<a class="btn green small" style="text-decoration:none; text-align:center;" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">Avisar por WhatsApp</a>`
             : `<span class="muted" style="font-size:13px;">Teléfono no reconocido para WhatsApp</span>`}
        <button class="btn ghost small" onclick="copyWinner('${rec.key}',${i})">Copiar mensaje</button>
      </div></div>`;
  });
  h += `<div class="card noprint" style="margin-top:18px;"><div class="row" style="justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="font-size:20px;">Anuncio para redes y grupos</h3><button class="btn small" onclick="copy(document.getElementById('ann').value)">Copiar anuncio</button></div>
      <textarea id="ann">${esc(announcement(rec))}</textarea></div>`;
  h += `</div>`;
  return h;
}

/* ---------------- acciones ---------------- */
function selectDraw(k){ S.current=k; S.run=null; render(); }
async function reloadData(){ S.run=null; await loadAll(); }
function setCutoff(v){ S.cutoff[S.current]=v; render(); }
function getRec(key){ return (S.run && S.run.key===key && S.run.rec) || S.saved[key]; }
function copyWinner(key,i){ const rec=getRec(key); const w=sortedWinners(rec)[i]; copy(winnerMessage(w,rec)); }
function redo(){
  const t = prompt("Para repetir el sorteo escribí REPETIR. Los ganadores guardados se reemplazarán.");
  if(t && t.trim().toUpperCase()==="REPETIR"){ delete S.saved[S.current]; try{ localStorage.removeItem("kps-sorteo-"+S.current); }catch(_){} S.run=null; render(); }
}
function fullscreen(){ const st=$("#stage"); if(!document.fullscreenElement && st.requestFullscreen) st.requestFullscreen(); else if(document.exitFullscreen) document.exitFullscreen(); }

render();
if(S.logged) loadAll();
</script>
</body>
</html>
