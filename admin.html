a{color:inherit;}

.login-shell{max-width:360px;margin:90px auto;text-align:center;}

.btn{border:2px solid var(--chrome);background:none;color:var(--chrome);border-radius:6px;padding:10px 18px;font-weight:700;font-size:.95rem;}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.top-bar h1{font-size:1.5rem;color:var(--white);}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.tab-btn{background:var(--asphalt-2);color:#bbb;border:1.5px solid var(--line);border-radius:6px;padding:9px 16px;font-weight:700;font-size:.88rem;}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);}

.banner{padding:12px 18px;border-radius:8px;font-weight:700;font-size:.9rem;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;}
.banner.info{background:#e8f4fb;color:#0d4f6e;}
.banner.error{background:#fde8e7;color:#8a1410;}
.banner button{background:none;border:none;font-size:18px;font-weight:900;color:inherit;padding:0 4px;}

.card{background:var(--asphalt-2);border:1.5px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.card-head span{font-family:var(--font-mono);font-size:.72rem;color:#9EA1A8;}
.field{margin-bottom:12px;}
.field label{display:block;font-family:var(--font-mono);font-size:.7rem;color:#9EA1A8;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:5px;border:1.5px solid #444;background:#111;color:#fff;font-family:var(--font-body);font-size:.92rem;}
.field textarea{min-height:64px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.row5{display:grid;grid-template-columns:1fr 2fr 1.5fr 1.5fr 1fr auto;gap:8px;align-items:end;}
.row4{display:grid;grid-template-columns:1fr 2.5fr 1.5fr 1fr auto;gap:8px;align-items:end;}
@media(max-width:760px){.row2,.row3{grid-template-columns:1fr;}.row5,.row4{grid-template-columns:1fr;}}
.check-row{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-top:4px;}
.remove-btn{background:none;border:1.5px solid var(--red);color:var(--red);border-radius:5px;padding:7px 10px;font-size:.8rem;font-weight:700;}
.add-btn{background:none;border:1.5px dashed var(--chrome);color:var(--chrome);border-radius:6px;padding:10px;width:100%;font-weight:700;font-size:.88rem;}
.section-title{font-size:1.2rem;color:var(--white);margin-bottom:4px;}

const state = {
  loggedIn:false, passInput:"", error:"",
  loading:true, saving:false, banner:null,
  tab:"logo",
  data: defaultData()
};

let _db = null;
function getDb(){
  if(_db) return _db;
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  _db = firebase.firestore();
  return _db;
}
async function loadContent(){
  try{
    const doc = await getDb().collection("settings").doc("site_content").get();
    if(doc.exists){
      const d = doc.data();
      state.data = Object.assign(defaultData(), d);
    }
  }catch(err){
    showBanner("error", "No se pudo leer el contenido: " + err.message);
  }
}
async function saveContent(){
  state.saving = true; render();
  try{
    await getDb().collection("settings").doc("site_content").set(state.data);
    showBanner("info", "Cambios guardados. Ya se ven en el sitio.");
  }catch(err){
    showBanner("error", "No se pudo guardar: " + err.message);
  }
  state.saving = false; render();
}
function showBanner(type, text){ state.banner = {type, text}; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function compressImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Archivo de imagen inválido."));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ TAB: PUNTUACIONES ============ */

  const grouped = {};
  items.forEach((r, i) => { const cat = r.categoria || "(sin categoría)"; (grouped[cat] = grouped[cat] || []).push(i); });
  const cats = Object.keys(grouped);

  const groupsHtml = cats.map(cat => {
    const rowsHtml = grouped[cat].map(i => {
      const r = items[i];
      return `
      <div class="row4">
        <div class="field"><label>Pos.</label><input data-f="puntuaciones:${i}:posicion" value="${esc(r.posicion)}"></div>
        <div class="field"><label>Piloto</label><input data-f="puntuaciones:${i}:piloto" value="${esc(r.piloto)}"></div>
        <div class="field"><label>Nº de Kart</label><input data-f="puntuaciones:${i}:numero_kart" value="${esc(r.numero_kart)}"></div>
        <div class="field"><label>Puntos</label><input data-f="puntuaciones:${i}:puntos" value="${esc(r.puntos)}"></div>
        <button class="remove-btn" data-remove="puntuaciones:${i}">Sacar</button>
      </div>`;
    }).join("");
    return `
    <div class="card group-card">
      <div class="card-head"><span>CATEGORÍA</span></div>
      <div class="field"><input data-f-cat="${esc(cat)}" value="${esc(cat)}" placeholder="Nombre de la categoría"></div>
      ${rowsHtml}
      <button class="add-btn" data-add-row="${esc(cat)}">+ Agregar piloto en esta categoría</button>
    </div>`;
  }).join("");

  return `
    <div class="card">
      <h2 class="section-title">Cargar desde Excel</h2>
      <p class="section-sub">
        Subí la planilla completa con <strong>todas las categorías activas</strong> y se reemplaza todo el ranking de una sola vez.
        Columnas esperadas (en cualquier orden, los nombres pueden variar un poco): <span class="mono">Categoria</span>,
        <span class="mono">Posicion</span>, <span class="mono">Piloto</span>, <span class="mono">Numero de Kart</span>, <span class="mono">Puntos</span>.
      </p>
      <input type="file" id="puntuacionesExcel" accept=".xlsx,.xls,.csv">
    </div>
    <h2 class="section-title">Puntuaciones / Ranking</h2>
    <p class="section-sub">Las pestañas de categoría del sitio se arman solas según los nombres que uses acá. No hace falta ordenar por posición, el sitio lo hace solo.</p>
    ${groupsHtml || '<p class="section-sub">Todavía no hay categorías cargadas.</p>'}
    <button class="add-btn" data-add-group="1">+ Agregar una categoría nueva</button>`;
}

/* ============ TAB: INSCRIPCIONES RECIBIDAS ============ */
const inscState = { loaded:false, loading:false, items:[] };

async function loadInscripciones(force){
  if(inscState.loaded && !force) return;
  inscState.loading = true; render();
  try{
    const snap = await getDb().collection("inscripciones").orderBy("createdAt", "desc").get();
    inscState.items = snap.docs.map(d => d.data());
    inscState.loaded = true;
  }catch(err){
    showBanner("error", "No se pudieron cargar las inscripciones: " + err.message);
  }
  inscState.loading = false; render();
}

async function setInscripcionStatus(id, status){
  try{
    await getDb().collection("inscripciones").doc(id).update({ status });
    await loadInscripciones(true);
  }catch(err){
    showBanner("error", "No se pudo actualizar: " + err.message);
  }
}

function renderInscripcionesRecibidasTab(){
  if(inscState.loading){
    return `<p class="section-sub">Cargando inscripciones…</p>`;
  }
  const rows = inscState.items.map(o => {
    const datosHtml = Object.entries(o.datos || {}).map(([k,v]) => `<div><span style="color:#9EA1A8;">${esc(k)}:</span> ${esc(v)}</div>`).join("");
    const fecha = o.createdAt ? new Date(o.createdAt).toLocaleString("es-AR") : "";
    const badgeColor = o.status==="aprobado" ? "#3fae5b" : o.status==="rechazado" ? "var(--red)" : "#f0a825";
    const actions = o.status==="pendiente"
      ? `<button class="btn" style="border-color:#3fae5b;color:#3fae5b;margin-right:8px;" data-approve-insc="${o.id}">Aprobar</button>
         <button class="remove-btn" data-reject-insc="${o.id}">Anular</button>`
      : `<button class="btn" data-approve-insc="${o.id}" style="opacity:.5;" disabled>${o.status==="aprobado"?"Aprobada":"Anulada"}</button>`;
    return `
    <div class="card">
      <div class="card-head">
        <span>${esc(fecha)}</span>
        <span class="mono" style="color:${badgeColor};font-weight:700;">${esc((o.status||"").toUpperCase())}</span>
      </div>
      <div style="font-size:.9rem;margin-bottom:10px;">${datosHtml}</div>
      <div style="font-size:.85rem;color:#9EA1A8;margin-bottom:12px;">Comprobante: <span class="mono">${esc(o.payReference)}</span></div>
      ${actions}
    </div>`;
  }).join("");

  return `
    <h2 class="section-title">Inscripciones recibidas</h2>
    <p class="section-sub">Revisá el comprobante de cada una contra tus movimientos de Mercado Pago antes de aprobar.</p>
    <button class="btn" id="refreshInsc" style="margin-bottom:16px;">↻ Actualizar</button>
    ${rows || '<p class="section-sub">Todavía no llegó ninguna inscripción.</p>'}`;
}

/* ============ RENDER PRINCIPAL ============ */
function renderTabContent(){
  if(state.tab==="bloques") return renderBloquesTab();
  if(state.tab==="logo") return renderLogoTab();
  if(state.tab==="general") return renderGeneralTab();
  if(state.tab==="redes") return renderRedesTab();
  if(state.tab==="reglamento") return renderReglamentoTab();
  if(state.tab==="pagos") return renderPagosTab();
  if(state.tab==="categorias") return renderCategoriasTab();
  if(state.tab==="calendario") return renderCalendarioTab();
  if(state.tab==="puntuaciones") return renderPuntuacionesTab();
  if(state.tab==="sponsors") return renderSponsorsTab();
  if(state.tab==="inscripcion") return renderInscripcionTab();
  if(state.tab==="inscripciones_recibidas") return renderInscripcionesRecibidasTab();
  return "";
}

function render(){
  const app = document.getElementById("app");
  if(!state.loggedIn){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if(state.loading){ app.innerHTML = `<div class="wrap"><p style="color:#999;">Cargando contenido…</p></div>`; return; }
  app.innerHTML = renderShell(renderTabContent());
  attachShellEvents();
}

/* ============ EVENTOS ============ */
function attachLoginEvents(){
  document.getElementById("passInput")?.addEventListener("input", e => { state.passInput = e.target.value; });
  document.getElementById("passInput")?.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  document.getElementById("loginBtn")?.addEventListener("click", doLogin);
}
async function doLogin(){
  if(state.passInput === ADMIN_PASSWORD){
    state.loggedIn = true; state.error = ""; state.loading = true;
    render();
    await loadContent();
    state.loading = false;
    render();
  } else {
    state.error = "Clave incorrecta. Intentá de nuevo.";
    render();
  }
}

function setDeep(path, value){
  // path tipo "categorias:2:nombre"
  const [coll, idxStr, key] = path.split(":");
  state.data[coll][parseInt(idxStr,10)][key] = value;
}

function attachShellEvents(){
  document.getElementById("closeBanner")?.addEventListener("click", () => { state.banner = null; render(); });
  document.getElementById("logoutBtn")?.addEventListener("click", () => { state.loggedIn = false; state.passInput = ""; render(); });
  document.getElementById("saveBtn")?.addEventListener("click", saveContent);
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      render();
      if(state.tab === "inscripciones_recibidas") loadInscripciones(false);
    });
  });
  document.getElementById("refreshInsc")?.addEventListener("click", () => loadInscripciones(true));
  document.querySelectorAll("[data-approve-insc]").forEach(btn => {
    btn.addEventListener("click", () => setInscripcionStatus(btn.dataset.approveInsc, "aprobado"));
  });
  document.querySelectorAll("[data-reject-insc]").forEach(btn => {
    btn.addEventListener("click", () => setInscripcionStatus(btn.dataset.rejectInsc, "rechazado"));
  });

  document.querySelectorAll("[data-block-visible]").forEach(el => {
    el.addEventListener("change", () => {
      state.data.blocks[Number(el.dataset.blockVisible)].visible = el.checked;
    });
  });
  document.querySelectorAll("[data-block-up]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.blockUp);
      const arr = state.data.blocks;
      [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
      render();
    });
  });
  document.querySelectorAll("[data-block-down]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.blockDown);
      const arr = state.data.blocks;
      [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
      render();
    });
  });

  document.querySelectorAll("[data-f-top]").forEach(el => {
    el.addEventListener("input", () => { state.data[el.dataset.fTop] = el.value; });
  });

  document.querySelectorAll("[data-f]").forEach(el => {
    el.addEventListener("input", () => setDeep(el.dataset.f, el.value));
    el.addEventListener("change", () => setDeep(el.dataset.f, el.value));
  });
  document.querySelectorAll("[data-fc]").forEach(el => {
    el.addEventListener("change", () => setDeep(el.dataset.fc, el.checked));
  });
  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [coll, idxStr] = btn.dataset.remove.split(":");
      state.data[coll].splice(parseInt(idxStr,10), 1);
      render();
    });
  });
  document.querySelectorAll("[data-add]").forEach(btn => {
    btn.addEventListener("click", () => {
      const coll = btn.dataset.add;
      const blanks = {
        categorias: {orden:"", nombre:"", descripcion:"", etiqueta:""},
        calendario: {numero:"", fechas:"", estado:"A definir", nota:"", fotos:"", carpeta_drive:""},
        sponsors: {nombre:"", logo_url:"", link:"", activo:true},
        inscripcion_campos: {orden:String(state.data.inscripcion_campos.length+1), etiqueta:"", tipo:"texto", opciones:"", requerido:false}
      };
      state.data[coll].push(blanks[coll]);
      render();
    });
  });

  // Puntuaciones: agregar piloto dentro de una categoría existente
  document.querySelectorAll("[data-add-row]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.data.puntuaciones.push({categoria: btn.dataset.addRow, posicion:"", piloto:"", numero_kart:"", puntos:""});
      render();
    });
  });
  // Puntuaciones: agregar categoría nueva
  document.querySelector("[data-add-group]")?.addEventListener("click", () => {
    state.data.puntuaciones.push({categoria:"Nueva categoría", posicion:"1", piloto:"", numero_kart:"", puntos:""});
    render();
  });
  // Puntuaciones: cargar planilla Excel (reemplaza todo el ranking)
  document.getElementById("puntuacionesExcel")?.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
      const findKey = (rowKeys, patterns) => rowKeys.find(k => patterns.some(p => norm(k).includes(p)));

      const parsed = rows.map(row => {
        const keys = Object.keys(row);
        const kCat = findKey(keys, ["categ"]);
        const kPos = findKey(keys, ["pos"]);
        const kPiloto = findKey(keys, ["pilot"]);
        const kKart = findKey(keys, ["kart", "nro", "numero", "n°"]);
        const kPuntos = findKey(keys, ["punt"]);
        return {
          categoria: kCat ? String(row[kCat]).trim() : "",
          posicion: kPos ? String(row[kPos]).trim() : "",
          piloto: kPiloto ? String(row[kPiloto]).trim() : "",
          numero_kart: kKart ? String(row[kKart]).trim() : "",
          puntos: kPuntos ? String(row[kPuntos]).trim() : ""
        };
      }).filter(r => r.categoria && r.piloto);

      if(!parsed.length){
        showBanner("error", "No se encontraron filas válidas en la planilla. Revisá que tenga columnas de Categoría y Piloto.");
        return;
      }
      state.data.puntuaciones = parsed;
      showBanner("info", `Se cargaron ${parsed.length} filas desde la planilla. Revisá y hacé clic en "Guardar cambios" para publicarlas.`);
      render();
    }catch(err){
      showBanner("error", "No se pudo leer el archivo: " + err.message);
    }
  });
  // Puntuaciones: renombrar categoría (aplica a todas las filas de ese grupo)
  document.querySelectorAll("[data-f-cat]").forEach(input => {
    input.addEventListener("change", () => {
      const oldCat = input.dataset.fCat;
      state.data.puntuaciones.forEach(r => { if(r.categoria === oldCat) r.categoria = input.value; });
      render();
    });
  });

  // Logo
  document.getElementById("logoFile")?.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      state.data.header_logo = await compressImageFile(file, 400);
      render();
    }catch(err){ showBanner("error", "No se pudo procesar la imagen: " + err.message); }
  });
  document.getElementById("clearLogo")?.addEventListener("click", () => { state.data.header_logo = ""; render(); });

  // Sponsors: subir logo
  document.querySelectorAll("[data-sponsor-file]").forEach(input => {
    input.addEventListener("change", async (e) => {
      const idx = Number(input.dataset.sponsorFile);
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        state.data.sponsors[idx].logo_url = await compressImageFile(file, 400);
        render();
      }catch(err){ showBanner("error", "No se pudo procesar la imagen: " + err.message); }
    });
  });
}

render();
</script>
